<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="UTF-8" />
<title>{{ page.title }}{% if page.series %} — {{ page.series }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}" />
<meta property="og:type" content="{% if page.layout == 'article' %}article{% else %}website{% endif %}" />
<meta property="og:title" content="{{ page.og_title | default: page.title }}" />
<meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description | strip_newlines }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ page.twitter_title | default: page.og_title | default: page.title }}" />
<meta name="twitter:description" content="{{ page.twitter_description | default: page.og_description | default: page.description | default: site.description | strip_newlines }}" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% if page.lang_url %}<link rel="alternate" hreflang="{% if page.lang == 'en' %}es{% else %}en{% endif %}" href="{{ page.lang_url | absolute_url }}" />{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
{% feed_meta %}
</head>
<body>
{{ content }}
</body>
</html>
