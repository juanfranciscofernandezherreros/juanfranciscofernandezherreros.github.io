title: Juan Francisco Fernández Herreros
description: >-
  Portfolio y blog sobre Java, Spring Boot, microservicios, Kafka, Kubernetes y
  arquitectura de software, con ejemplos prácticos y experiencias reales.
url: "https://juanfranciscofernandezherreros.github.io"
baseurl: ""
lang: es
author: Juan Francisco Fernández Herreros

markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - vendor
  - node_modules
